<div class="min-h-screen flex items-center justify-center bg-[var(--canvas)] p-5">
  <div class="w-full max-w-[400px] bg-[var(--bg)] border border-[var(--border)] rounded-xl p-8 sm:p-9 shadow-lg shadow-black/5">
    <div class="flex flex-col items-center text-center mb-6">
      <div class="w-9 h-9 rounded-[10px] grid place-items-center text-white font-bold font-serif text-lg bg-gradient-to-br from-[#6458f1] to-[#8c45e5] shadow-md shadow-[#6a5bea]/25 mb-3.5">
        W
      </div>
      <h2 class="text-2xl font-display mb-1.5 text-[var(--text)] font-semibold">{{ i18n.t('auth.login_title') }}</h2>
      <p class="text-xs text-[var(--muted)] m-0">{{ i18n.t('auth.login_subtitle') }}</p>
    </div>

    @if (errorMessage()) {
      <div class="bg-red-50 dark:bg-red-950/40 border border-red-200 dark:border-red-800 text-red-600 dark:text-red-400 p-2.5 px-3 rounded-md text-xs mb-4">
        {{ errorMessage() }}
      </div>
    }

    <form (ngSubmit)="onSubmit()" class="flex flex-col gap-4">
      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-semibold text-[var(--text)]">{{ i18n.t('auth.email') }}</label>
        <input
          type="email"
          [(ngModel)]="email"
          name="email"
          required
          placeholder="alex@weave.so"
          autocomplete="email"
          class="h-9 border border-[var(--border)] rounded-md px-3 text-xs bg-[var(--panel)] text-[var(--text)] outline-none focus:border-[var(--accent)] transition-colors"
        />
      </div>

      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-semibold text-[var(--text)]">{{ i18n.t('auth.password') }}</label>
        <input
          type="password"
          [(ngModel)]="password"
          name="password"
          required
          placeholder="••••••••"
          autocomplete="current-password"
          class="h-9 border border-[var(--border)] rounded-md px-3 text-xs bg-[var(--panel)] text-[var(--text)] outline-none focus:border-[var(--accent)] transition-colors"
        />
      </div>

      <button
        type="submit"
        [disabled]="isLoading()"
        class="h-9.5 mt-2 bg-[var(--accent)] text-white rounded-md text-xs font-semibold hover:opacity-90 disabled:opacity-50 transition-opacity"
      >
        {{ isLoading() ? '...' : i18n.t('auth.login_button') }}
      </button>
    </form>

    <div class="mt-6 flex justify-center gap-1.5 text-xs text-[var(--muted)]">
      <span>{{ i18n.t('auth.no_account') }}</span>
      <a routerLink="/register" class="text-[var(--accent)] font-semibold hover:underline no-underline">{{ i18n.t('auth.register_button') }}</a>
    </div>
  </div>
</div>
