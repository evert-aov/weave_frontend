<div class="tabs-bar-root" (click)="showTypeMenu.set(false)">
  <!-- Flechas de navegación previa / siguiente pestaña -->
  <div class="tabs-nav-actions">
    <button
      type="button"
      class="nav-arrow-btn"
      [disabled]="!notesService.hasPreviousTab()"
      (click)="notesService.goToPreviousTab()"
      [title]="i18n.currentLang() === 'es' ? 'Pestaña anterior' : 'Previous tab'"
    >
      <app-icon name="arrow-left" [size]="13"></app-icon>
    </button>

    <button
      type="button"
      class="nav-arrow-btn"
      [disabled]="!notesService.hasNextTab()"
      (click)="notesService.goToNextTab()"
      [title]="i18n.currentLang() === 'es' ? 'Siguiente pestaña' : 'Next tab'"
    >
      <app-icon name="arrow-right" [size]="13"></app-icon>
    </button>
  </div>

  <!-- Contenedor scrollable de pestañas -->
  <div class="tabs-scroll-container">
    @for (tab of notesService.openTabs(); track tab.noteId) {
      <div
        class="tab-item"
        [class.active]="notesService.currentNote()?._id === tab.noteId"
        (click)="onTabClick(tab)"
        (auxclick)="onAuxClick(tab, $event)"
        [title]="tab.title || (i18n.currentLang() === 'es' ? 'Nueva pestaña' : 'New tab')"
      >
        <span class="tab-icon" [ngClass]="tab.docType || 'block'">
          <app-icon [name]="getTabIcon(tab.docType)" [size]="13"></app-icon>
        </span>

        <span class="tab-title">
          {{ tab.title || (i18n.currentLang() === 'es' ? 'Nueva pestaña' : 'New tab') }}
        </span>

        <button
          type="button"
          class="tab-close-btn"
          (click)="onTabClose(tab, $event)"
          [title]="i18n.currentLang() === 'es' ? 'Cerrar pestaña' : 'Close tab'"
        >
          <app-icon name="close" [size]="10"></app-icon>
        </button>
      </div>
    }

    <!-- Botón para abrir una nueva pestaña (+) con menú selector de tipo -->
    <div class="add-tab-wrapper">
      <button
        type="button"
        class="tab-add-btn"
        (click)="toggleTypeMenu($event)"
        [title]="i18n.t('doc_type.create_title')"
      >
        <app-icon name="plus" [size]="12"></app-icon>
      </button>

      @if (showTypeMenu()) {
        <div class="new-tab-menu" (click)="$event.stopPropagation()">
          <div class="menu-header">
            <span>{{ i18n.t('doc_type.create_title') }}</span>
          </div>

          <!-- Paso 1: Nombre del documento -->
          <div class="menu-name-field">
            <input
              id="new-tab-title-input"
              type="text"
              class="menu-name-input"
              [ngModel]="newTabTitle()"
              (ngModelChange)="newTabTitle.set($event)"
              (keydown.enter)="$event.preventDefault()"
              [placeholder]="i18n.currentLang() === 'es' ? 'Nombre del documento...' : 'Document name...'"
              autofocus
            />
          </div>

          <button type="button" class="type-menu-item" (click)="createNewTabOfType('block')">
            <span class="item-icon block">
              <app-icon name="file-text" [size]="13"></app-icon>
            </span>
            <div class="item-text">
              <strong>{{ i18n.t('doc_type.block_title') }}</strong>
              <small>{{ i18n.t('doc_type.block_desc') }}</small>
            </div>
          </button>

          <button type="button" class="type-menu-item" (click)="createNewTabOfType('sheet')">
            <span class="item-icon sheet">
              <app-icon name="sheet" [size]="13"></app-icon>
            </span>
            <div class="item-text">
              <strong>{{ i18n.t('doc_type.sheet_title') }}</strong>
              <small>{{ i18n.t('doc_type.sheet_desc') }}</small>
            </div>
          </button>

          <button type="button" class="type-menu-item" (click)="createNewTabOfType('doc')">
            <span class="item-icon doc">
              <app-icon name="file-text" [size]="13"></app-icon>
            </span>
            <div class="item-text">
              <strong>{{ i18n.t('doc_type.doc_title') }}</strong>
              <small>{{ i18n.t('doc_type.doc_desc') }}</small>
            </div>
          </button>

          <button type="button" class="type-menu-item" (click)="createNewTabOfType('canvas')">
            <span class="item-icon canvas">
              <app-icon name="canvas" [size]="13"></app-icon>
            </span>
            <div class="item-text">
              <strong>{{ i18n.t('doc_type.canvas_title') }}</strong>
              <small>{{ i18n.t('doc_type.canvas_desc') }}</small>
            </div>
          </button>

          <button type="button" class="type-menu-item" (click)="createNewTabOfType('slide')">
            <span class="item-icon slide">
              <app-icon name="presentation" [size]="13"></app-icon>
            </span>
            <div class="item-text">
              <strong>{{ i18n.t('doc_type.slide_title') }}</strong>
              <small>{{ i18n.t('doc_type.slide_desc') }}</small>
            </div>
          </button>
        </div>
      }
    </div>
  </div>
</div>
