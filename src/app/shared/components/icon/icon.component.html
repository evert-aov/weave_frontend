<svg
  [attr.width]="size"
  [attr.height]="size"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="1.7"
  stroke-linecap="round"
  stroke-linejoin="round"
  aria-hidden="true"
>
  @switch (name) {
    @case ('grid') {
      <rect x="3" y="3" width="7" height="7" rx="2"/>
      <rect x="14" y="3" width="7" height="7" rx="2"/>
      <rect x="3" y="14" width="7" height="7" rx="2"/>
      <rect x="14" y="14" width="7" height="7" rx="2"/>
    }
    @case ('search') {
      <circle cx="11" cy="11" r="7"/>
      <path d="m20 20-4-4"/>
    }
    @case ('inbox') {
      <path d="M4 5h16v13H4z"/>
      <path d="M4 14h5l2 2h2l2-2h5"/>
    }
    @case ('file') {
      <path d="M6 3h8l4 4v14H6z"/>
      <path d="M14 3v5h5"/>
    }
    @case ('folder') {
      <path d="M3 6h7l2 2h9v11H3z"/>
    }
    @case ('chevron') {
      <path d="m9 18 6-6-6-6"/>
    }
    @case ('plus') {
      <path d="M12 5v14M5 12h14"/>
    }
    @case ('more') {
      <circle cx="5" cy="12" r="1"/>
      <circle cx="12" cy="12" r="1"/>
      <circle cx="19" cy="12" r="1"/>
    }
    @case ('sun') {
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
    }
    @case ('moon') {
      <path d="M20 15.5A8.5 8.5 0 0 1 8.5 4 8.5 8.5 0 1 0 20 15.5Z"/>
    }
    @case ('share') {
      <circle cx="18" cy="5" r="2"/>
      <circle cx="6" cy="12" r="2"/>
      <circle cx="18" cy="19" r="2"/>
      <path d="m8 11 8-5m-8 7 8 5"/>
    }
    @case ('code') {
      <path d="m8 9-4 3 4 3m8-6 4 3-4 3M14 5l-4 14"/>
    }
    @case ('sheet') {
      <rect x="3" y="3" width="18" height="18" rx="2"/>
      <path d="M3 9h18M9 3v18M15 3v18M3 15h18"/>
    }
    @case ('canvas') {
      <rect x="3" y="4" width="18" height="16" rx="2"/>
      <path d="m7 16 3-4 3 2 4-6"/>
    }
    @case ('sigma') {
      <path d="M18 5H7l6 7-6 7h11"/>
    }
    @case ('diagram') {
      <rect x="3" y="3" width="6" height="5" rx="1"/>
      <rect x="15" y="16" width="6" height="5" rx="1"/>
      <path d="M9 5.5h4a4 4 0 0 1 4 4V16"/>
    }
    @case ('text') {
      <path d="M5 6V4h14v2M12 4v16M8 20h8"/>
    }
    @case ('arrow') {
      <path d="m5 12 7-7v4h7v6h-7v4z"/>
    }
    @case ('pen') {
      <path d="m4 20 4-1L19 8l-3-3L5 16zM14 7l3 3"/>
    }
    @case ('type') {
      <path d="M4 7V4h16v3M12 4v16M8 20h8"/>
    }
    @case ('undo') {
      <path d="m9 7-5 5 5 5"/>
      <path d="M5 12h9a5 5 0 0 1 5 5"/>
    }
    @case ('redo') {
      <path d="m15 7 5 5-5 5"/>
      <path d="M19 12h-9a5 5 0 0 0-5 5"/>
    }
    @case ('comment') {
      <path d="M4 5h16v12H9l-5 4z"/>
    }
    @case ('panel') {
      <rect x="3" y="3" width="18" height="18" rx="2"/>
      <path d="M9 3v18"/>
    }
    @case ('image') {
      <rect x="3" y="3" width="18" height="18" rx="2"/>
      <circle cx="8.5" cy="8.5" r="1.5"/>
      <path d="m21 15-5-5L5 21"/>
    }
    @case ('camera') {
      <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/>
      <circle cx="12" cy="13" r="3"/>
    }
    @case ('trash') {
      <path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
    }
    @case ('up') {
      <path d="m18 15-6-6-6 6"/>
    }
    @case ('down') {
      <path d="m6 9 6 6 6-6"/>
    }
    @case ('palette') {
      <circle cx="13.5" cy="6.5" r=".7" fill="currentColor"/>
      <circle cx="17.5" cy="10.5" r=".7" fill="currentColor"/>
      <circle cx="8.5" cy="7.5" r=".7" fill="currentColor"/>
      <circle cx="6.5" cy="12.5" r=".7" fill="currentColor"/>

    }
    @case ('sliders') {
      <line x1="4" x2="4" y1="21" y2="14"/>
      <line x1="4" x2="4" y1="10" y2="3"/>
      <line x1="12" x2="12" y1="21" y2="12"/>
      <line x1="12" x2="12" y1="8" y2="3"/>
      <line x1="20" x2="20" y1="21" y2="16"/>
      <line x1="20" x2="20" y1="12" y2="3"/>
      <line x1="1" x2="7" y1="14" y2="14"/>
      <line x1="9" x2="15" y1="8" y2="8"/>
      <line x1="17" x2="23" y1="16" y2="16"/>
    }
    @case ('save') {
      <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
      <polyline points="17 21 17 13 7 13 7 21"/>
      <polyline points="7 3 7 8 15 8"/>
    }
    @case ('close') {
      <path d="M18 6 6 18M6 6l12 12"/>
    }
    @case ('check') {
      <polyline points="20 6 9 17 4 12"/>
    }
    @case ('refresh') {
      <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
      <path d="M3 3v5h5"/>
    }
    @case ('book') {
      <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/>
      <path d="M6 6h10"/>
    }
    @case ('eye') {
      <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
      <circle cx="12" cy="12" r="3"/>
    }
    @case ('download') {
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
      <polyline points="7 10 12 15 17 10"/>
      <line x1="12" y1="15" x2="12" y2="3"/>
    }
    @case ('printer') {
      <polyline points="6 9 6 2 18 2 18 9"/>
      <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
      <rect x="6" y="14" width="12" height="8"/>
    }
    @case ('zoom-in') {
      <circle cx="11" cy="11" r="7"/>
      <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      <line x1="11" y1="8" x2="11" y2="14"/>
      <line x1="8" y1="11" x2="14" y2="11"/>
    }
    @case ('zoom-out') {
      <circle cx="11" cy="11" r="7"/>
      <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      <line x1="8" y1="11" x2="14" y2="11"/>
    }
    @case ('target') {
      <circle cx="12" cy="12" r="10"/>
      <circle cx="12" cy="12" r="6"/>
      <circle cx="12" cy="12" r="2"/>
    }
    @case ('file-text') {
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
      <polyline points="14 2 14 8 20 8"/>
      <line x1="16" y1="13" x2="8" y2="13"/>
      <line x1="16" y1="17" x2="8" y2="17"/>
      <polyline points="10 9 9 9 8 9"/>
    }
    @case ('paperclip') {
      <path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l7.88-7.88"/>
    }
    @case ('folder-input') {
      <path d="M2 9V5c0-1.1.9-2 2-2h3.93a2 2 0 0 1 1.66.9l.82 1.2a2 2 0 0 0 1.66.9H20a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-1"/>
      <path d="M2 13h10"/>
      <path d="m9 10 3 3-3 3"/>
    }
    @case ('move') {
      <polyline points="5 9 2 12 5 15"/>
      <polyline points="9 5 12 2 15 5"/>
      <polyline points="15 19 12 22 9 19"/>
      <polyline points="19 9 22 12 19 15"/>
      <line x1="2" y1="12" x2="22" y2="12"/>
      <line x1="12" y1="2" x2="12" y2="22"/>
    }
  }
</svg>
