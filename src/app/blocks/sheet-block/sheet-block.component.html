<div
  class="univer-sheet-block"
  [class.reading-mode]="notesService.isReadingMode()"
>
  <!-- Barra superior de información y zoom del bloque -->
  <div class="sheet-toolbar-strip" [class.reading-mode]="notesService.isReadingMode()">
    <div class="sheet-info-group">
      <app-icon name="sheet" [size]="16" class="text-accent"></app-icon>
      <span class="badge-title">
        {{ i18n.currentLang() === 'es' ? 'Hoja de Cálculo' : 'Spreadsheet' }}
      </span>
      @if (!notesService.isReadingMode()) {
        <span class="badge-subtitle">
          {{ i18n.currentLang() === 'es' ? 'Cálculos matemáticos reales en vivo' : 'Live real-time formulas & computing' }}
        </span>
      }
    </div>

    <!-- Controles de Zoom para Hoja de Cálculo (Edición y Lectura) -->
    <div class="sheet-zoom-controls">
      <button
        type="button"
        class="zoom-btn"
        (click)="zoomOut()"
        [title]="i18n.currentLang() === 'es' ? 'Reducir zoom' : 'Zoom out'"
      >
        <app-icon name="zoom-out" [size]="13"></app-icon>
      </button>
      <button
        type="button"
        class="zoom-display-btn"
        (click)="resetZoom()"
        [title]="i18n.currentLang() === 'es' ? 'Restablecer zoom a 100%' : 'Reset zoom to 100%'"
      >
        {{ Math.round(currentZoom() * 100) }}%
      </button>
      <button
        type="button"
        class="zoom-btn"
        (click)="zoomIn()"
        [title]="i18n.currentLang() === 'es' ? 'Aumentar zoom' : 'Zoom in'"
      >
        <app-icon name="zoom-in" [size]="13"></app-icon>
      </button>
    </div>
  </div>

  <div
    class="sheet-container-wrapper"
    [class.reading-mode]="notesService.isReadingMode()"
    [style.height.px]="notesService.isReadingMode() ? readingHeight() : 460"
    (wheel)="onWheelScroll($event)"
  >
    <div
      #sheetContainer
      class="univer-container"
      [style.zoom]="1 / notesService.documentZoom()"
      [style.width.%]="100 * notesService.documentZoom()"
      [style.height.%]="100 * notesService.documentZoom()"
    ></div>
  </div>
</div>
