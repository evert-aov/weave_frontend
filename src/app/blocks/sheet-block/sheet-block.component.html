<div class="sheet-block-wrapper rounded-xl border overflow-hidden my-3 shadow-xs transition-colors"
     [class.bg-slate-900]="themeService.isDark()"
     [class.border-slate-700]="themeService.isDark()"
     [class.bg-white]="!themeService.isDark()"
     [class.border-slate-200]="!themeService.isDark()">

  <!-- Toolbar header -->
  <div class="px-3 py-2 border-b flex items-center justify-between text-xs"
       [class.border-slate-700]="themeService.isDark()"
       [class.bg-slate-800]="themeService.isDark()"
       [class.border-slate-200]="!themeService.isDark()"
       [class.bg-slate-50]="!themeService.isDark()">

    <div class="flex items-center gap-2">
      <div class="w-5 h-5 rounded bg-emerald-600 flex items-center justify-center text-white font-bold text-[10px]">
        X
      </div>
      <span class="font-semibold text-xs">
        {{ i18n.currentLang() === 'es' ? 'Hoja de Cálculo' : 'Spreadsheet' }}
      </span>
      @if (!notesService.isReadingMode()) {
        <span class="text-[10px] text-slate-400">
          {{ i18n.currentLang() === 'es' ? 'Fórmulas dinámicas' : 'Dynamic formulas' }}
        </span>
      }
    </div>

    <!-- Zoom buttons -->
    <div class="flex items-center gap-1.5 text-xs text-slate-400">
      <button type="button" (click)="zoomOut()" class="hover:text-emerald-500 px-1 font-mono">-</button>
      <button type="button" (click)="resetZoom()" class="font-mono text-[10px] w-9 text-center">
        {{ Math.round(currentZoom() * 100) }}%
      </button>
      <button type="button" (click)="zoomIn()" class="hover:text-emerald-500 px-1 font-mono">+</button>
    </div>
  </div>

  <!-- Scrollable Canvas Sheet -->
  <div class="overflow-auto max-h-[380px] p-1">
    <div class="relative inline-block"
         [style.width.px]="Math.round(contentWidth * currentZoom())"
         [style.height.px]="Math.round(contentHeight * currentZoom())">
      <canvas
        #blockCanvas
        tabindex="0"
        role="grid"
        [attr.aria-label]="canvasA11ySummary"
        [attr.aria-rowcount]="totalRows"
        [attr.aria-colcount]="totalCols"
        [style.width.px]="Math.round(contentWidth * currentZoom())"
        [style.height.px]="Math.round(contentHeight * currentZoom())"
        class="block select-none cursor-cell outline-none focus-visible:ring-2 focus-visible:ring-emerald-500 rounded-xs"
        (click)="onCanvasClick($event)"
        (dblclick)="onCanvasDblClick($event)"
        (keydown)="onCanvasKeyDown($event)"
      ></canvas>

      @if (isEditing && !notesService.isReadingMode()) {
        <input
          #blockEditorInput
          type="text"
          [(ngModel)]="editingValue"
          (ngModelChange)="onEditorInput()"
          (keyup)="onEditorInput()"
          (blur)="commitEdit()"
          (keydown.enter)="$event.preventDefault(); commitEdit()"
          (keydown.escape)="$event.preventDefault(); cancelEdit()"
          [style.left.px]="editorBoxRect.left"
          [style.top.px]="editorBoxRect.top"
          [style.width.px]="editorBoxRect.width"
          [style.height.px]="editorBoxRect.height"
          class="absolute z-20 px-1.5 font-mono text-xs outline-none border-2 border-emerald-600 bg-white text-slate-900 shadow-xs"
        />
      }

      <div class="sr-only" aria-hidden="false">
        <div role="row" [attr.aria-rowindex]="selectedCell.row + 1">
          <div
            role="gridcell"
            aria-selected="true"
            aria-live="polite"
            [attr.aria-colindex]="selectedCell.col + 1"
            [attr.data-active-cell]="activeCellId"
          >{{ activeCellA11yLabel }}</div>
        </div>
      </div>
    </div>
  </div>
</div>
