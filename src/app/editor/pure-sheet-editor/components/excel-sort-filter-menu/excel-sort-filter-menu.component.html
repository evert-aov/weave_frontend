<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-xs p-4"
     (click)="close.emit()">
  <div class="w-64 rounded-xl shadow-2xl border p-2 transition-colors"
       [class.bg-slate-800]="themeService.isDark()"
       [class.border-slate-700]="themeService.isDark()"
       [class.text-white]="themeService.isDark()"
       [class.bg-white]="!themeService.isDark()"
       [class.border-slate-200]="!themeService.isDark()"
       [class.text-slate-800]="!themeService.isDark()"
       (click)="$event.stopPropagation()">
    
    <div class="px-2.5 py-1.5 text-xs font-semibold text-slate-400 border-b mb-1 flex items-center justify-between"
         [class.border-slate-700]="themeService.isDark()"
         [class.border-slate-200]="!themeService.isDark()">
      <span>{{ i18n.currentLang() === 'es' ? 'Ordenar y Filtrar' : 'Sort & Filter' }}</span>
      <button type="button" (click)="close.emit()" class="text-slate-400 hover:text-slate-200 cursor-pointer">
        <svg lucideIcon="x" [size]="14"></svg>
      </button>
    </div>

    <button type="button"
            (click)="sortAsc.emit(); close.emit()"
            class="w-full flex items-center gap-2.5 px-3 py-2 rounded-lg text-xs font-medium text-left transition-colors cursor-pointer"
            [class.hover:bg-slate-700]="themeService.isDark()"
            [class.hover:bg-slate-100]="!themeService.isDark()">
      <span class="w-4 h-4 flex items-center justify-center text-emerald-500">
        <svg lucideIcon="arrow-up" [size]="14"></svg>
      </span>
      <span>{{ i18n.currentLang() === 'es' ? 'Ordenar de A a Z / Menor a Mayor' : 'Sort A to Z / Smallest to Largest' }}</span>
    </button>

    <button type="button"
            (click)="sortDesc.emit(); close.emit()"
            class="w-full flex items-center gap-2.5 px-3 py-2 rounded-lg text-xs font-medium text-left transition-colors cursor-pointer"
            [class.hover:bg-slate-700]="themeService.isDark()"
            [class.hover:bg-slate-100]="!themeService.isDark()">
      <span class="w-4 h-4 flex items-center justify-center text-amber-500">
        <svg lucideIcon="arrow-down" [size]="14"></svg>
      </span>
      <span>{{ i18n.currentLang() === 'es' ? 'Ordenar de Z a A / Mayor a Menor' : 'Sort Z to A / Largest to Smallest' }}</span>
    </button>

    <div class="my-1 border-t"
         [class.border-slate-700]="themeService.isDark()"
         [class.border-slate-200]="!themeService.isDark()"></div>

    <button type="button"
            (click)="toggleFilter.emit(); close.emit()"
            class="w-full flex items-center gap-2.5 px-3 py-2 rounded-lg text-xs font-medium text-left transition-colors cursor-pointer"
            [class.hover:bg-slate-700]="themeService.isDark()"
            [class.hover:bg-slate-100]="!themeService.isDark()">
      <span class="w-4 h-4 flex items-center justify-center text-sky-500">
        <svg lucideIcon="filter" [size]="14"></svg>
      </span>
      <span>{{ filterActive ? (i18n.currentLang() === 'es' ? 'Desactivar Filtro' : 'Disable Filter') : (i18n.currentLang() === 'es' ? 'Activar Filtro' : 'Enable Filter') }}</span>
    </button>

    @if (filterActive) {
      <button type="button"
              (click)="clearFilters.emit(); close.emit()"
              class="w-full flex items-center gap-2.5 px-3 py-2 rounded-lg text-xs font-medium text-rose-500 text-left transition-colors cursor-pointer"
              [class.hover:bg-slate-700]="themeService.isDark()"
              [class.hover:bg-slate-100]="!themeService.isDark()">
        <span class="w-4 h-4 flex items-center justify-center">
          <svg lucideIcon="filter-x" [size]="14"></svg>
        </span>
        <span>{{ i18n.currentLang() === 'es' ? 'Borrar todos los filtros' : 'Clear all filters' }}</span>
      </button>
    }
  </div>
</div>
