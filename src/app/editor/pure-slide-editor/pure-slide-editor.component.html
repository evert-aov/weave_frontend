<div class="pure-slide-workspace" [class.dark-theme]="isDarkTheme()">
  <!-- Contenedor del visor/editor PowerPoint con pptx-angular-viewer -->
  <main class="slide-mount-container" #slideWrapper>
    @if (pptxBytes(); as bytes) {
      <pptx-viewer
        #viewer
        [content]="bytes"
        [fileName]="note.title || 'Presentación'"
        [canEdit]="true"
        [theme]="currentTheme()"
        [defaultThemeKey]="themeKey()"
        [autosave]="true"
        (dirtyChange)="onDirtyChange($event)"
      ></pptx-viewer>
    } @else {
      <div class="loading-pptx">
        <span>{{ i18n.currentLang() === 'es' ? 'Cargando presentación...' : 'Loading presentation...' }}</span>
      </div>
    }
  </main>
</div>
