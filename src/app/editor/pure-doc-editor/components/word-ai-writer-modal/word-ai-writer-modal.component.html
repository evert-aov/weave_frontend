@if (isOpen) {
  <div class="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl border border-slate-200 max-w-lg w-full overflow-hidden">
      <div class="px-5 py-4 bg-gradient-to-r from-violet-600 to-blue-600 text-white flex items-center justify-between">
        <div class="flex items-center gap-2">
          <svg lucideIcon="sparkles" [size]="20" class="w-5 h-5"></svg>
          <h3 class="font-semibold text-sm">Asistente de Redacción IA para Word</h3>
        </div>
        <button
          type="button"
          (click)="close.emit()"
          class="text-white/80 hover:text-white p-1 rounded-lg"
        >
          <svg lucideIcon="x" [size]="16" class="w-4 h-4"></svg>
        </button>
      </div>

      <form (submit)="handleGenerate($event)" class="p-5 space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1.5">
            ¿Qué sección, tabla o documento deseas redactar?
          </label>
          <textarea
            rows="3"
            [value]="prompt()"
            (input)="prompt.set($any($event.target).value)"
            placeholder="Ej: Crea una sección H2 sobre plan de marketing con una tabla de 4 columnas..."
            class="w-full px-3.5 py-2.5 text-sm border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500"
          ></textarea>
        </div>

        <div>
          <div class="text-[11px] font-medium text-slate-500 mb-2">Sugerencias rápidas:</div>
          <div class="flex flex-wrap gap-1.5">
            @for (preset of presetPrompts; track preset) {
              <button
                type="button"
                (click)="prompt.set(preset)"
                class="text-left text-[11px] px-2.5 py-1.5 rounded-lg bg-slate-100 hover:bg-blue-50 hover:text-blue-700 text-slate-600 transition-colors"
              >
                {{ preset }}
              </button>
            }
          </div>
        </div>

        @if (error()) {
          <div class="text-xs text-red-600 bg-red-50 border border-red-200 rounded-lg px-3 py-2">
            {{ error() }}
          </div>
        }

        <div class="flex items-center justify-end gap-2 pt-2 border-t border-slate-100">
          <button
            type="button"
            (click)="close.emit()"
            class="px-4 py-2 text-xs font-medium text-slate-600 hover:bg-slate-100 rounded-lg"
          >
            Cancelar
          </button>
          <button
            type="submit"
            [disabled]="loading() || !prompt().trim()"
            class="flex items-center gap-2 px-4 py-2 bg-blue-600 hover:bg-blue-700 disabled:opacity-50 text-white text-xs font-semibold rounded-lg shadow-sm transition-colors"
          >
            @if (loading()) {
              <svg lucideIcon="loader-2" [size]="14" class="w-3.5 h-3.5 animate-spin"></svg>
              <span>Generando estructura...</span>
            } @else {
              <svg lucideIcon="check" [size]="14" class="w-3.5 h-3.5"></svg>
              <span>Insertar en el Documento</span>
            }
          </button>
        </div>
      </form>
    </div>
  </div>
}
