<div
  class="absolute top-full left-0 mt-1.5 z-[1000] rounded-xl shadow-2xl border p-3.5 w-64 select-none transition-colors"
  [ngClass]="darkMode ? 'bg-[#18181b] border-[#3f3f46] text-[#f4f4f5]' : 'bg-white border-slate-300 text-slate-800'"
  (mousedown)="onMouseDown($event)"
>
  <div class="flex items-center justify-between mb-2">
    <span class="text-xs font-semibold" [ngClass]="darkMode ? 'text-slate-200' : 'text-slate-700'">Insertar tabla</span>
    <span class="text-xs font-mono font-medium text-blue-500 px-2 py-0.5 rounded" [ngClass]="darkMode ? 'bg-blue-950/60' : 'bg-blue-50'">
      {{ hoverCols() }} × {{ hoverRows() }}
    </span>
  </div>

  <div class="grid grid-cols-8 gap-1 p-1.5 rounded-lg border" [ngClass]="darkMode ? 'bg-[#202024] border-[#323238]' : 'bg-slate-50 border-slate-200/80'">
    @for (r of rows; track r) {
      @for (c of cols; track c) {
        <button
          type="button"
          (mouseenter)="setHover(r, c)"
          (click)="handleCellClick(r, c)"
          [ngClass]="isSelected(c, r) ? 'bg-blue-600/40 border-blue-500' : (darkMode ? 'bg-[#18181b] border-[#3f3f46] hover:border-blue-400' : 'bg-white border-slate-300 hover:border-blue-400')"
          class="w-5 h-5 rounded-sm border transition-colors"
          [title]="c + ' columnas × ' + r + ' filas'"
        ></button>
      }
    }
  </div>

  <form (submit)="handleCustomInsert($event)" class="mt-3 pt-3 border-t" [ngClass]="darkMode ? 'border-[#27272a]' : 'border-slate-100'">
    <div class="text-[11px] font-medium mb-2" [ngClass]="darkMode ? 'text-slate-400' : 'text-slate-500'">Tamaño personalizado</div>
    <div class="flex items-center gap-2">
      <label class="flex-1 text-[11px]" [ngClass]="darkMode ? 'text-slate-400' : 'text-slate-600'">
        Filas
        <input
          type="number"
          min="1"
          max="30"
          [value]="customRows()"
          (input)="onCustomRows($event)"
          [ngClass]="darkMode ? 'bg-[#202024] border-[#3f3f46] text-[#f4f4f5]' : 'bg-white border-slate-200 text-slate-800'"
          class="w-full mt-0.5 px-2 py-1 text-xs border rounded focus:outline-none focus:border-blue-500"
        />
      </label>
      <label class="flex-1 text-[11px]" [ngClass]="darkMode ? 'text-slate-400' : 'text-slate-600'">
        Cols
        <input
          type="number"
          min="1"
          max="15"
          [value]="customCols()"
          (input)="onCustomCols($event)"
          [ngClass]="darkMode ? 'bg-[#202024] border-[#3f3f46] text-[#f4f4f5]' : 'bg-white border-slate-200 text-slate-800'"
          class="w-full mt-0.5 px-2 py-1 text-xs border rounded focus:outline-none focus:border-blue-500"
        />
      </label>
      <button
        type="submit"
        class="mt-4 px-2.5 py-1 bg-blue-600 hover:bg-blue-700 text-white text-xs font-medium rounded transition-colors"
      >
        Crear
      </button>
    </div>
  </form>
</div>
