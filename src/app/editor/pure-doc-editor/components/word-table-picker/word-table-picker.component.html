<div
  class="absolute top-full left-0 mt-1.5 z-50 bg-white rounded-xl shadow-xl border border-slate-200 p-3.5 w-64 select-none"
  (mousedown)="onMouseDown($event)"
>
  <div class="flex items-center justify-between mb-2">
    <span class="text-xs font-semibold text-slate-700">Insertar tabla</span>
    <span class="text-xs font-mono font-medium text-blue-600 bg-blue-50 px-2 py-0.5 rounded">
      {{ hoverCols() }} × {{ hoverRows() }}
    </span>
  </div>

  <div class="grid grid-cols-8 gap-1 p-1.5 bg-slate-50 rounded-lg border border-slate-200/80">
    @for (r of rows; track r) {
      @for (c of cols; track c) {
        <button
          type="button"
          (mouseenter)="setHover(r, c)"
          (click)="handleCellClick(r, c)"
          [ngClass]="isSelected(c, r) ? 'bg-blue-500/20 border-blue-600' : 'bg-white border-slate-300 hover:border-blue-400'"
          class="w-5 h-5 rounded-sm border transition-colors"
          [title]="c + ' columnas × ' + r + ' filas'"
        ></button>
      }
    }
  </div>

  <form (submit)="handleCustomInsert($event)" class="mt-3 pt-3 border-t border-slate-100">
    <div class="text-[11px] font-medium text-slate-500 mb-2">Tamaño personalizado</div>
    <div class="flex items-center gap-2">
      <label class="flex-1 text-[11px] text-slate-600">
        Filas
        <input
          type="number"
          min="1"
          max="30"
          [value]="customRows()"
          (input)="onCustomRows($event)"
          class="w-full mt-0.5 px-2 py-1 text-xs border border-slate-200 rounded focus:outline-none focus:border-blue-500"
        />
      </label>
      <label class="flex-1 text-[11px] text-slate-600">
        Cols
        <input
          type="number"
          min="1"
          max="15"
          [value]="customCols()"
          (input)="onCustomCols($event)"
          class="w-full mt-0.5 px-2 py-1 text-xs border border-slate-200 rounded focus:outline-none focus:border-blue-500"
        />
      </label>
      <button
        type="submit"
        class="mt-4 px-2.5 py-1 bg-blue-600 hover:bg-blue-700 text-white text-xs font-medium rounded transition-colors"
      >
        Crear
      </button>
    </div>
  </form>
</div>
